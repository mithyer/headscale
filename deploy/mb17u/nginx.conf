user root;
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;

events {
    worker_connections 1024;
}

http {
    log_format proxy '$proxy_protocol_addr - $remote_user [$time_local] '
                     '"$request" $status $body_bytes_sent '
                     '"$http_referer" "$http_user_agent"';
    access_log /dev/stdout proxy;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    upstream headscale_backend {
        server headscale:8080;
        keepalive 16;
    }

    server {
        listen 1234 ssl proxy_protocol;
        server_name ts.886996007.xyz;

        ssl_certificate /etc/letsencrypt/live/ts.886996007.xyz/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/ts.886996007.xyz/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache shared:TLS:1m;
        ssl_session_timeout 10m;

        add_header X-Content-Type-Options nosniff always;

        location / {
            proxy_pass http://headscale_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $proxy_protocol_addr;
            proxy_set_header X-Forwarded-For $proxy_protocol_addr;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Port 1234;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }
    }

    server {
        listen 127.0.0.1:8081;
        access_log off;

        location = /healthz {
            proxy_pass http://headscale_backend/health;
            proxy_http_version 1.1;
            proxy_set_header Host ts.886996007.xyz:1234;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
